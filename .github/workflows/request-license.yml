name: Request Unity License File

on:
  workflow_dispatch:

jobs:
  requestLicense:
    name: Generate activation file (.alf)
    runs-on: ubuntu-latest
    steps:
      - name: Generate manual activation file via Unity in Docker
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            unityci/editor:ubuntu-6000.0.84f1-base-3.2.2 \
            bash -c "unity-editor -batchmode -nographics -quit -logFile /dev/stdout -createManualActivationFile || true; echo '--- workspace files ---'; ls -la /workspace"

      - name: Upload activation file artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_Activation_License
          path: Unity_v*.alf
          if-no-files-found: error
