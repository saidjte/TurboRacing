name: Acquire Unity ULF (one-time)

on:
  workflow_dispatch:

jobs:
  acquireUlf:
    name: Acquire .ulf license file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install puppeteer
        run: npm install puppeteer@23 --no-save

      - name: Acquire .ulf license file (robot)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          node .github/scripts/activation-robot.js
          ls -la

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-debug
          path: shot_*.png
          if-no-files-found: ignore

      - name: Upload .ulf artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Unity_ULF
          path: '*.ulf'
          if-no-files-found: error
