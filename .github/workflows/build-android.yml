name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  buildAndroid:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - name: Build the project (Android APK)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 6000.0.84f1
          buildMethod: BuildCommand.PerformBuild
          buildName: TurboRacing

      # Stable release signing (v0.6.2): explicit zipalign + apksigner with the
      # same keystore on every build so updates install over previous versions
      # without uninstalling. (Relaying on unity-builder env vars was not
      # enough with a custom buildMethod - the run came out signed with a
      # random debug key - so we sign explicitly here.)
      - name: Sign APK with stable release key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS_NAME }}
          KS_ALIAS_PASS: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/game.keystore"
          BT=""
          for v in 35.0.0 34.0.0 36.0.0 33.0.2 33.0.1; do
            if [ -x "$ANDROID_HOME/build-tools/$v/apksigner" ]; then BT="$ANDROID_HOME/build-tools/$v"; break; fi
          done
          if [ -z "$BT" ]; then BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1); fi
          echo "Using build-tools: $BT"
          APK=$(ls build/Android/*.apk | head -1)
          ls -la build/Android/
          # AGP output is already zipaligned; apksigner re-signs in place
          # (replaces any existing debug signature) while preserving alignment
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/game.keystore" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KS_ALIAS_PASS" \
            --out "$APK.signed" "$APK"
          mv "$APK.signed" "$APK"
          "$BT/apksigner" verify --print-certs "$APK" | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboRacing-APK
          path: build/Android/*.apk
          if-no-files-found: error
